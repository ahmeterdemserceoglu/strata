[package]
name = "strata-desktop"
version = "0.1.0"
description = "Strata Desktop Client"
authors = ["Strata Contributors"]
edition = "2021"

[lib]
name = "strata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-opener = "2.2"
tauri-plugin-notification = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
